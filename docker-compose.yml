# Environnement local : PostgreSQL, migrations, application Next.js et sauvegardes.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mojo_erp}
      POSTGRES_USER: ${POSTGRES_USER:-mojo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mojo_admin} -d ${POSTGRES_DB:-mojo_erp}"]
      interval: 5s
      retries: 10

  migrate:
    image: postgres:16
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-mojo_erp}
      PGUSER: ${POSTGRES_USER:-mojo_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?définir APP_DB_PASSWORD dans .env}
    volumes:
      - ./db:/work/db:ro
      - ./scripts:/work/scripts:ro
    entrypoint: ["bash", "/work/scripts/migrate.sh"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-mojo_erp}
      PGUSER: mojo_app
      PGPASSWORD: ${APP_DB_PASSWORD:?définir APP_DB_PASSWORD dans .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:3000:3000"

  backup:
    profiles: ["encrypted-backup"]
    build:
      context: .
      dockerfile: scripts/backup.Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-mojo_erp}
      PGUSER: ${POSTGRES_USER:-mojo_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MOJO_BACKUP_ENCRYPTION_KEY: ${MOJO_BACKUP_ENCRYPTION_KEY:-}
      MOJO_BACKUP_OFFSITE_DIR: /offsite
      MOJO_BACKUP_OFFSITE_HOST_PATH: ${MOJO_BACKUP_OFFSITE_HOST_PATH:-}
      MOJO_RESTORE_TEST_DATABASE: ${MOJO_RESTORE_TEST_DATABASE:-}
    volumes:
      - type: bind
        source: ${MOJO_BACKUP_OFFSITE_HOST_PATH:-./backups}
        target: /offsite

volumes:
  pgdata:
